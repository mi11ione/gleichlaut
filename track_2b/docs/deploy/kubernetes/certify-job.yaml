# One-off Jobs: put the GGUF on the models PVC, and certify. kubectl apply -n gleichlaut -f certify-job.yaml, then delete the
# finished Jobs (or set ttlSecondsAfterFinished). Exit codes: 0 PASS, 5 FAIL, 7 PENDING_REVIEW, 2 configuration.
#
#   gleichlaut-fetch-gguf          writes the pinned GGUF to the models PVC (mounted read-write here only) and checks its
#                                  sha256. Needs egress to huggingface.co once (networkpolicy.yaml, rule "fetch-gguf").
#   gleichlaut-certify-build       the build certificate of the pinned 8B GGUF from the recorded M1 run (PREREG R1): the
#                                  stored records are re-scored with the frozen checks and the M1 labels; PASS only if the
#                                  pre-registered rule holds. Seconds, no model, no network. Needed only with an HMAC key
#                                  (the image already carries the unsigned certificate, which the gate accepts without one).
#   gleichlaut-certify-build-local the same certificate from a run of the frozen 166 suite on the cluster's CPU, offline image
#                                  (hours: ~7 h at the measured 153.4 s per item on 4 cores). Evidence for your own hardware.
#   gleichlaut-certify-endpoint    the 70B endpoint of gleichlaut-70b.yaml (about 285 requests, under an hour)
apiVersion: batch/v1
kind: Job
metadata: { name: gleichlaut-fetch-gguf, labels: { app: gleichlaut } }
spec:
  backoffLimit: 1
  template:
    metadata: { labels: { app: gleichlaut, job: fetch-gguf } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: fetch
          image: registry.example.ch/gleichlaut:CHANGE-ME
          args: [python, -m, gleichlaut, fetch-gguf]
          env: [{ name: GLEICHLAUT_MODELS, value: /models }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: gleichlaut-models }    # read-write only in this Job
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: batch/v1
kind: Job
metadata: { name: gleichlaut-certify-build, labels: { app: gleichlaut } }
spec:
  backoffLimit: 0
  template:
    metadata: { labels: { app: gleichlaut, job: certify } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: certify
          image: registry.example.ch/gleichlaut:CHANGE-ME
          args: [python, -m, gleichlaut, certify, --import-run, data/runs/8b_q4_k_m_fresh166_g3_final.jsonl,
                 --gguf-sha256, a037df8d87ff6caacee794ee85f55342f2152e0d359b7389033300c3bee5f299,
                 --labels, eval/labels/m1_q4_k_m_fresh166.tsv]
          envFrom: [{ configMapRef: { name: gleichlaut-config } }]
          env: [{ name: GLEICHLAUT_CERT_KEY, value: /var/run/secrets/gleichlaut/cert.key }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts:
            - { name: data, mountPath: /app/state, subPath: state }
            - { name: data, mountPath: /app/out, subPath: out }
            - { name: tmp, mountPath: /tmp }
            - { name: key, mountPath: /var/run/secrets/gleichlaut, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gleichlaut-data }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: key
          secret: { secretName: gleichlaut-cert-key, items: [{ key: cert.key, path: cert.key }], defaultMode: 0400 }
---
apiVersion: batch/v1
kind: Job
metadata: { name: gleichlaut-certify-build-local, labels: { app: gleichlaut } }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 64800        # 18 h
  template:
    metadata: { labels: { app: gleichlaut, job: certify, lane: 8b } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: certify
          image: registry.example.ch/gleichlaut-offline:CHANGE-ME
          args: [python, -m, gleichlaut, certify, --backend, llamacpp, --gguf, /models/apertus-v1.5-8b-text-q4_k_m.gguf]
          envFrom: [{ configMapRef: { name: gleichlaut-config } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: "4", memory: 8Gi }, limits: { cpu: "4", memory: 10Gi } }
          volumeMounts:
            - { name: data, mountPath: /app/state, subPath: state }
            - { name: data, mountPath: /app/out, subPath: out }
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gleichlaut-data }
        - name: models
          persistentVolumeClaim: { claimName: gleichlaut-models, readOnly: true }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: batch/v1
kind: Job
metadata: { name: gleichlaut-certify-endpoint, labels: { app: gleichlaut } }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    metadata: { labels: { app: gleichlaut, job: certify, lane: 70b } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: certify
          image: registry.example.ch/gleichlaut:CHANGE-ME
          args: [python, -m, gleichlaut, certify, --backend, openai]
          envFrom: [{ configMapRef: { name: gleichlaut-70b-config } }]
          env:
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: gleichlaut-endpoint, key: LLM_API_KEY } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
          volumeMounts:
            - { name: data, mountPath: /app/state, subPath: state }
            - { name: data, mountPath: /app/out, subPath: out }
            - { name: tmp, mountPath: /tmp }
            - { name: key, mountPath: /var/run/secrets/gleichlaut, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gleichlaut-data }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: key
          secret: { secretName: gleichlaut-endpoint, items: [{ key: cert.key, path: cert.key }], defaultMode: 0400 }
