# One-off Jobs: put the GGUF on the models PVC, and certify. Apply the one you need, not the whole file at once:
#   kubectl apply -n gleichlaut -f certify-job.yaml -l job=fetch-gguf          # gleichlaut-fetch-gguf
#   kubectl apply -n gleichlaut -f certify-job.yaml -l 'job=certify,!lane'     # gleichlaut-certify-build
#   kubectl apply -n gleichlaut -f certify-job.yaml -l lane=8b                 # gleichlaut-certify-build-local
#   kubectl apply -n gleichlaut -f certify-job.yaml -l lane=70b                # gleichlaut-certify-endpoint
# then delete the finished Jobs (or set ttlSecondsAfterFinished). Exit codes: 0 PASS, 5 FAIL, 7 PENDING_REVIEW, 2 configuration.
# Images: digest form, filled from your CI (gleichlaut.yaml, header). Secrets: gleichlaut-cert-key (the certificate HMAC
# key, the same Secret for every Job and both lanes) and, for the 70B lane only, gleichlaut-endpoint (LLM_API_KEY).
#
#   gleichlaut-fetch-gguf          writes the pinned GGUF to the models PVC (mounted read-write here only) and checks its
#                                  sha256. Reads gleichlaut-config: GLEICHLAUT_MODEL_URL (an internal mirror instead of
#                                  huggingface.co), GLEICHLAUT_BUILD, HTTPS_PROXY, SSL_CERT_FILE (the gleichlaut-ca ConfigMap
#                                  is mounted). Needs egress to the mirror, the proxy or huggingface.co once (networkpolicy.yaml,
#                                  rule "fetch-gguf"). A failed attempt keeps the .part file; the retry resumes it (HTTP Range).
#                                  No egress at all: models-loader.yaml instead (kubectl cp; docs/deploy/README.md).
#   gleichlaut-certify-build       the build certificate of the pinned 8B GGUF from its recorded run (PREREG R1; the M2 run
#                                  of the default Q8_0 below; for Q4_K_M use 8b_q4_k_m_fresh166_g3_final.jsonl, sha256
#                                  a037df8d87ff6caacee794ee85f55342f2152e0d359b7389033300c3bee5f299, m1_q4_k_m_fresh166.tsv):
#                                  the stored records are re-scored with the frozen checks and that run's labels; PASS only if the
#                                  pre-registered rule holds. Seconds, no model, no network. Needed only with an HMAC key
#                                  (the image already carries the unsigned certificate, which the gate accepts without one).
#   gleichlaut-certify-build-local the same certificate from a run of the frozen 166 suite on the cluster's CPU, offline image
#                                  (hours: ~9.2 h for Q8_0 at the measured 200.5 s per item on 4 cores; ~7.1 h for Q4_K_M).
#                                  Evidence for your own hardware.
#   gleichlaut-certify-endpoint    the 70B endpoint of gleichlaut-70b.yaml (about 285 requests, under an hour)
apiVersion: batch/v1
kind: Job
metadata: { name: gleichlaut-fetch-gguf, labels: { app: gleichlaut, job: fetch-gguf } }
spec:
  backoffLimit: 3                     # a retry resumes the partial download
  template:
    metadata: { labels: { app: gleichlaut, job: fetch-gguf } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: fetch
          image: registry.example.ch/gleichlaut@sha256:CHANGE-ME
          args: [python, -m, gleichlaut, fetch-gguf]
          envFrom: [{ configMapRef: { name: gleichlaut-config } }]     # GLEICHLAUT_MODELS, MODEL_URL, BUILD, proxy, CA
          env: [{ name: GLEICHLAUT_MODELS, value: /models }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
            - { name: ca, mountPath: /etc/gleichlaut/ca, readOnly: true }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: gleichlaut-models }    # read-write only in this Job (and models-loader.yaml)
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: ca
          configMap: { name: gleichlaut-ca, optional: true }
---
apiVersion: batch/v1
kind: Job
metadata: { name: gleichlaut-certify-build, labels: { app: gleichlaut, job: certify } }
spec:
  backoffLimit: 0
  template:
    metadata: { labels: { app: gleichlaut, job: certify } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: certify
          image: registry.example.ch/gleichlaut@sha256:CHANGE-ME
          args: [python, -m, gleichlaut, certify, --import-run, data/runs/8b_q8_0_fresh166_g3_final.jsonl,
                 --gguf-sha256, dea904ad80cd725ec89962abae464477f5d8114d1f4377514f381f7dc2ed202d,
                 --labels, eval/labels/m1_q8_0_fresh166.tsv]
          envFrom: [{ configMapRef: { name: gleichlaut-config } }]
          env: [{ name: GLEICHLAUT_CERT_KEY, value: /var/run/secrets/gleichlaut/cert.key }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts:
            - { name: data, mountPath: /app/state, subPath: state }
            - { name: data, mountPath: /app/out, subPath: out }
            - { name: tmp, mountPath: /tmp }
            - { name: key, mountPath: /var/run/secrets/gleichlaut, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gleichlaut-data }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: key
          secret: { secretName: gleichlaut-cert-key, items: [{ key: cert.key, path: cert.key }], defaultMode: 0400 }
---
apiVersion: batch/v1
kind: Job
metadata: { name: gleichlaut-certify-build-local, labels: { app: gleichlaut, job: certify, lane: 8b } }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 64800        # 18 h
  template:
    metadata: { labels: { app: gleichlaut, job: certify, lane: 8b } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: certify
          image: registry.example.ch/gleichlaut-offline@sha256:CHANGE-ME
          args: [python, -m, gleichlaut, certify, --backend, llamacpp, --gguf, /models/apertus-v1.5-8b-text-q8_0.gguf]
          envFrom: [{ configMapRef: { name: gleichlaut-config } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: "4", memory: 16Gi }, limits: { cpu: "4", memory: 18Gi } }     # Q4_K_M: 8Gi / 10Gi
          volumeMounts:
            - { name: data, mountPath: /app/state, subPath: state }
            - { name: data, mountPath: /app/out, subPath: out }
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: key, mountPath: /var/run/secrets/gleichlaut, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gleichlaut-data }
        - name: models
          persistentVolumeClaim: { claimName: gleichlaut-models, readOnly: true }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: key                     # optional, as in gleichlaut.yaml: signs the certificate once GLEICHLAUT_CERT_KEY is set
          secret: { secretName: gleichlaut-cert-key, optional: true, items: [{ key: cert.key, path: cert.key }], defaultMode: 0400 }
---
apiVersion: batch/v1
kind: Job
metadata: { name: gleichlaut-certify-endpoint, labels: { app: gleichlaut, job: certify, lane: 70b } }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    metadata: { labels: { app: gleichlaut, job: certify, lane: 70b } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: certify
          image: registry.example.ch/gleichlaut@sha256:CHANGE-ME
          args: [python, -m, gleichlaut, certify, --backend, openai]
          envFrom: [{ configMapRef: { name: gleichlaut-70b-config } }]
          env:
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: gleichlaut-endpoint, key: LLM_API_KEY } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
          volumeMounts:
            - { name: data, mountPath: /app/state, subPath: state }
            - { name: data, mountPath: /app/out, subPath: out }
            - { name: tmp, mountPath: /tmp }
            - { name: key, mountPath: /var/run/secrets/gleichlaut, readOnly: true }
            - { name: ca, mountPath: /etc/gleichlaut/ca, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gleichlaut-data }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: key                     # the same Secret as the 8B lane; required here (gleichlaut-70b-config sets GLEICHLAUT_CERT_KEY)
          secret: { secretName: gleichlaut-cert-key, items: [{ key: cert.key, path: cert.key }], defaultMode: 0400 }
        - name: ca
          configMap: { name: gleichlaut-ca, optional: true }
