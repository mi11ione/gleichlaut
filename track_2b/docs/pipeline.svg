<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="800" height="120" fill="#fcfcfb"/><rect x="12" y="22" width="116" height="76" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1"/><text x="70.0" y="44" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Mine</text><text x="70.0" y="64" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">German change from the</text><text x="70.0" y="78" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">monthly feed / Fedlex</text><path d="M130 60 L141 60" stroke="#8a8984" stroke-width="1.5"/><path d="M140 56 L144 60 L140 64" fill="none" stroke="#8a8984" stroke-width="1.5"/><rect x="144" y="22" width="116" height="76" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1"/><text x="202.0" y="44" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Lock + slots</text><text x="202.0" y="64" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">windows from the DE diff;</text><text x="202.0" y="78" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">numbers -> slot codes</text><path d="M262 60 L273 60" stroke="#8a8984" stroke-width="1.5"/><path d="M272 56 L276 60 L272 64" fill="none" stroke="#8a8984" stroke-width="1.5"/><rect x="276" y="22" width="116" height="76" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><text x="334.0" y="44" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="bold">Draft</text><text x="334.0" y="64" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">Apertus rewrites the</text><text x="334.0" y="78" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">paragraph (8B / 70B)</text><path d="M394 60 L405 60" stroke="#8a8984" stroke-width="1.5"/><path d="M404 56 L408 60 L404 64" fill="none" stroke="#8a8984" stroke-width="1.5"/><rect x="408" y="22" width="116" height="76" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1"/><text x="466.0" y="44" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Guards</text><text x="466.0" y="64" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">lock, numbers, German,</text><text x="466.0" y="78" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">stale, dropped, terms</text><path d="M526 60 L537 60" stroke="#8a8984" stroke-width="1.5"/><path d="M536 56 L540 60 L536 64" fill="none" stroke="#8a8984" stroke-width="1.5"/><rect x="540" y="22" width="116" height="76" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><text x="598.0" y="44" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="bold">Re-ask x1</text><text x="598.0" y="64" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">with the complaints;</text><text x="598.0" y="78" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">kept only if all pass</text><path d="M658 60 L669 60" stroke="#8a8984" stroke-width="1.5"/><path d="M668 56 L672 60 L668 64" fill="none" stroke="#8a8984" stroke-width="1.5"/><rect x="672" y="22" width="116" height="76" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1"/><text x="730.0" y="44" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Emit</text><text x="730.0" y="64" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">XLIFF 2.1, FHIR,</text><text x="730.0" y="78" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">review page</text><text x="12" y="14" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">Model steps in blue; everything else is deterministic code, frozen by sha256</text><text x="12" y="114" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="normal">Routing: Fedlex -> 8B on CPU  |  SL -> 70B on a certified endpoint  |  air-gapped SL -> 8B, every item reviewed  |  DE change > 60% -> human</text></svg>