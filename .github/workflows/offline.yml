# Offline lane evidence (manual): `make run-offline` on a clean GitHub runner, CPU only, no model endpoint, no secret.
# Builds the `offline` Docker target (llama-cpp-python 0.3.35 from source, GGML_NATIVE=OFF), downloads the pinned
# Apertus v1.5 8B GGUF (Q4_K_M, 5,059,027,136 bytes, sha256 a037df8d...f299; cached with actions/cache so it is fetched
# once), then runs the reproduction (freeze, re-execution, re-scoring, emit, review page) and the 5-item Fedlex live slice
# on the GGUF in llama.cpp. Passes only on "reproduction PASSED; live slice PASSED".
# Trigger: gh workflow run offline.yml -R mi11ione/gleichlaut
name: offline
on:
  workflow_dispatch:
jobs:
  run-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults: { run: { working-directory: track_2b } }
    env:
      GGUF: models/apertus-v1.5-8b-text-q4_k_m.gguf
      GLEICHLAUT_MODEL_SHA256: a037df8d87ff6caacee794ee85f55342f2152e0d359b7389033300c3bee5f299
    steps:
      - uses: actions/checkout@v7
      - name: runner
        run: nproc; free -h; df -h / .; docker version --format '{{.Server.Version}}'
      - name: free disk (docker build + 5 GB GGUF)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: restore GGUF cache
        id: gguf
        uses: actions/cache/restore@v6
        with: { path: track_2b/models, key: "gguf-apertus-v1.5-8b-text-q4_k_m-a037df8d" }
      - name: make run-offline
        run: |
          set -o pipefail
          mkdir -p models out
          time make run-offline 2>&1 | tee run-offline.log
          grep -q "reproduction PASSED; live slice PASSED" run-offline.log
      - name: GGUF sha256
        if: always()
        run: test -f "$GGUF" && echo "$GLEICHLAUT_MODEL_SHA256  $GGUF" | sha256sum -c -
      - name: save GGUF cache (also when the run failed, so the 5 GB are fetched once)
        if: always() && steps.gguf.outputs.cache-hit != 'true' && hashFiles('track_2b/models/*.gguf') != ''
        uses: actions/cache/save@v6
        with: { path: track_2b/models, key: "gguf-apertus-v1.5-8b-text-q4_k_m-a037df8d" }
      - name: summary
        if: always()
        run: |
          { echo '### make run-offline'; echo '```'; grep -E "^=== |live slice|reproduction|LIVE SLICE|GGUF verified|^--- " run-offline.log | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-offline
          path: |
            track_2b/run-offline.log
            track_2b/out
          retention-days: 30
