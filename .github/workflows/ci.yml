# Every push: tests, the offline replay, the claims check, the data budget, the SBOM check, and the judges' exact command
# (`make run` from track_2b/ on a clean checkout, in Docker, on CPU).
# Runner image pinned; actions on their current majors (all node24: checkout v7, setup-python v7, upload-artifact v7,
# verified 9 Oct 2026 with `gh api repos/actions/<name>/releases/latest`). No job calls a model.
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: track_2b } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: install (hash-pinned, the same lock as the Docker base image)
        run: pip install --require-hashes -r requirements.txt
      - name: SBOM is current (docs/sbom.json from the pinned requirements, base image digest, GGUF sha256)
        run: python tools/supply_chain.py sbom --check
      - name: editable install gives the gleichlaut command
        run: pip install -e . && gleichlaut --help | head -3 && gleichlaut certify --list
      - name: data/ budget (<= 100 MB)
        run: test $(du -sk data | cut -f1) -le 102400 && du -sh data
      - name: tests (incl. operations tests against gleichlaut.fake_endpoint, in process on localhost)
        run: PYTHONPATH=src python tests/run.py
      - name: claims (every number in README / report / notes -> results file)
        run: python tools/claims.py --scan README.md technical_report.md docs/notes-field.md
      - name: no secrets in the tree
        run: "! git grep -I -n -E '(sk-[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{30,}|BEGIN [A-Z ]*PRIVATE KEY|publicai\\.key)' -- . ':!.github'"
  make-run:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: track_2b } }
    steps:
      - uses: actions/checkout@v7
      - name: make run (clean checkout, Docker, CPU, no model endpoint -> --network none)
        run: set -o pipefail; time make run | tee make-run.log; grep -q "reproduction PASSED" make-run.log
      - uses: actions/upload-artifact@v7
        with: { name: make-run-out, path: track_2b/out, retention-days: 14 }
